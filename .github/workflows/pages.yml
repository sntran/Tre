name: Test and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the tests
        run: npm test

  deploy:
    # Deploy only from main, and only when all tests pass.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy only the game files
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js LICENSE _site/
          cp -r src data i18n art audio styles fonts _site/
          # The stories (?story=<name>) and the reference pages, so that the owner can open them on a device.
          mkdir -p _site/tests _site/docs
          cp -r tests/stories _site/tests/
          cp -r docs/reference _site/docs/
          mkdir _site/content
          cp content/LICENSE _site/content/
          find _site -name '*.md' -delete
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
